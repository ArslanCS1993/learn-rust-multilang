            <p><strong>冒泡排序</strong> 是一种简单的<strong>排序算法</strong>。它的工作原理是：重复地遍历要排序的<strong>数组</strong>，每次比较相邻的两个<strong>元素</strong>，如果它们的顺序错误就把它们<strong>交换</strong>过来。</p>
            <p>遍历<strong>数组</strong>的过程会重复进行，直到没有再需要<strong>交换</strong>，也就是<strong>数组</strong>已经<strong>有序</strong>。这个<strong>算法</strong>的名字由来是因为越大的<strong>元素</strong>会像<strong>气泡</strong>一样慢慢“<strong>冒泡</strong>”到<strong>数组</strong>的末端。</p>

        <span class="keyword">for</span> <span class="keyword">j</span> <span class="keyword">in</span> <span class="number">1</span>..(<span class="keyword">size</span> <span class="keyword">-</span> <span class="keyword">i</span>) {

            <h3>外层循环</h3>
            <p><code>for i in 0..(size - 1)</code> — 外层<strong>循环</strong>控制遍历的轮数，最多需要 <code>size - 1</code> 轮。</p>

            <h3>标记变量</h3>
            <p><code>let mut swapped = false</code> — 用一个<strong>标记</strong>变量记录本轮是否<strong>发生</strong>了<strong>交换</strong>。这是一个<strong>优化</strong>：如果某一轮完全没有<strong>交换</strong>，说明<strong>数组</strong>已经<strong>有序</strong>，可以提前结束。</p>

            <h3>内层循环</h3>

      { type: 'chapter', title: '10. 数据结构', children: [
        { title: '10.1. B树' },
        { title: '10.2. 二叉树' },
        { title: '10.3. AVL树' },
        { title: '10.4. 链表' },
        { title: '10.5. 堆' },
        { title: '10.6. 栈' },
        { title: '10.7. 队列' },
        { title: '10.8. Trie' },
      ]},
    ];

    // ===== UTILITIES =====
    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, m => ({'&':'&','<':'<','>':'>','"':'"',"'":'''}[m]));
    }

    // Tokenize Chinese text and wrap known words in clickable spans
    function processChineseText(html) {
      // Sort dictionary keys by length (longest first) to match compounds first
      const keys = Object.keys(DICTIONARY).sort((a, b) => b.length - a.length);
      let result = html;

      // First, protect existing HTML tags
      const tagPlaceholder = '___TAG_PLACEHOLDER___';
      const tags = [];
      result = result.replace(/<[^>]+>/g, (match) => {
        tags.push(match);
        return tagPlaceholder + (tags.length - 1) + tagPlaceholder;
      });

      // Now process text content - find Chinese sequences
      const chineseRegex = /[\u4e00-\u9fff]+/g;
      result = result.replace(chineseRegex, (match) => {
        // Try to match longest dictionary entries first
        let processed = match;
        for (const key of keys) {
          if (key.length > 1 && key.length <= match.length) {
            const regex = new RegExp(escapeRegExp(key), 'g');
            if (regex.test(match)) {
              processed = processed.replace(regex, `<span class="chinese-word" data-word="${escapeHtml(key)}">${key}</span>`);
            }
          }
        }
        // Then handle single characters not part of compounds
        for (const key of keys) {
          if (key.length === 1) {
            const regex = new RegExp(escapeRegExp(key), 'g');
            if (regex.test(processed) && !processed.includes(`data-word="${escapeHtml(key)}"`)) {
              processed = processed.replace(regex, `<span class="chinese-word" data-word="${escapeHtml(key)}">${key}</span>`);
            }
          }
        }
        return processed;
      });

      // Restore tags
      tags.forEach((tag, i) => {
        result = result.replace(tagPlaceholder + i + tagPlaceholder, tag);
      });

      return result;
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // ===== RENDER FUNCTIONS =====
    function renderNav() {
      const container = document.getElementById('nav-list');
      container.innerHTML = NAV.map(chapter => `
        <li class="nav-item">
          <span class="nav-link chapter">${escapeHtml(chapter.title)}</span>
          ${chapter.children ? `<ul style="margin-top:0.25rem;">${chapter.children.map(child => `
            <li class="nav-item">
              <a class="nav-link section ${child.active ? 'active' : ''}" href="#">${escapeHtml(child.title)}</a>
            </li>
          `).join('')}</ul>` : ''}
        </li>
      `).join('');
    }

    function renderBreadcrumb() {
      const container = document.getElementById('breadcrumb');
      container.innerHTML = ARTICLE.breadcrumb.map((item, i) => `
        ${i > 0 ? '<span style="margin:0 0.5rem;color:#30363d;">/</span>' : ''}
        ${item.url ? `<a href="${item.url}">${escapeHtml(item.text)}</a>` : `<span>${escapeHtml(item.text)}</span>`}
      `).join('');
    }

    function renderContent() {
      const container = document.getElementById('content');
      container.innerHTML = ARTICLE.sections.map(section => `
        <section id="${section.id}">
          <h2>${escapeHtml(section.title)}</h2>
          ${processChineseText(section.content)}
        </section>
      `).join('');

      document.getElementById('article-title').textContent = ARTICLE.title;

      // Attach click handlers to Chinese words
      document.querySelectorAll('.chinese-word').forEach(el => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const word = el.dataset.word;
          selectWord(word, el);
        });
      });
    }

    let selectedEl = null;
    function selectWord(word, el) {
      if (selectedEl) selectedEl.classList.remove('selected');
      el.classList.add('selected');
      selectedEl = el;
      renderDetail(word);
      // On mobile, open detail panel
      if (window.innerWidth <= 1100) {
        document.getElementById('detail-panel').classList.add('open');
      }
    }

    function renderDetail(word) {
      const info = DICTIONARY[word];
      const container = document.getElementById('detail-content');
      if (!info) {
        container.innerHTML = `<div class="detail-empty">No dictionary entry for "${escapeHtml(word)}"</div>`;
        return;
      }
      const isCompound = word.length > 1;
      container.innerHTML = `
        <div class="detail-title">${escapeHtml(word)}</div>
        <div class="detail-pinyin">${escapeHtml(info.pinyin)}</div>
        <span class="detail-type">${isCompound ? 'Compound Word' : 'Single Character'}</span>
        <div class="detail-section">
          <h4>Meaning</h4>
          <div class="detail-meaning">${escapeHtml(info.meaning)}</div>
        </div>
        ${info.components ? `
        <div class="detail-section">
          <h4>Components</h4>
          <div class="components-list">
            ${info.components.map(c => `<span class="component-tag">${escapeHtml(c)}</span>`).join('')}
          </div>
        </div>` : ''}
        ${info.story ? `
        <div class="detail-section">
          <h4>Mnemonic Story</h4>
          <div class="story">${escapeHtml(info.story)}</div>
        </div>` : ''}
        ${info.commonWords && info.commonWords.length ? `
        <div class="detail-section">
          <h4>Common Words</h4>
          <div class="common-words">
            ${info.commonWords.map(w => `<span class="word-tag" data-word="${escapeHtml(w)}">${escapeHtml(w)}</span>`).join('')}
          </div>
        </div>` : ''}
        ${info.svgAnimation ? `
        <div class="detail-section">
          <h4>SVG Animation</h4>
          <div class="animation-placeholder">
            <span class="anim-name">${escapeHtml(info.svgAnimation)}</span>
            Animation key only — not yet implemented
          </div>
        </div>` : ''}
      `;

      // Make common words clickable
      container.querySelectorAll('.word-tag').forEach(tag => {
        tag.addEventListener('click', () => {
          const w = tag.dataset.word;
          const el = document.querySelector(`.chinese-word[data-word="${CSS.escape(w)}"]`);
          if (el) selectWord(w, el);
          else renderDetail(w);
        });
      });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }
    function toggleDetail() {
      document.getElementById('detail-panel').classList.toggle('open');
    }

    // ===== INIT =====
    renderNav();
    renderBreadcrumb();
    renderContent();
  </script>
</body>
